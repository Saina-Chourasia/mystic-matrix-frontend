<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <radialGradient id="hexBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4C1D95" />
      <stop offset="70%" stop-color="#240046" />
      <stop offset="100%" stop-color="#0F051D" />
    </radialGradient>
    <linearGradient id="hatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B0764" />
      <stop offset="50%" stop-color="#581C87" />
      <stop offset="100%" stop-color="#2E1065" />
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#4C1D95" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="50" cy="50" r="48" fill="url(#hexBg)" stroke="#A855F7" stroke-width="2.5" />

  <!-- Mystical Aura / Glow -->
  <circle cx="50" cy="50" r="44" stroke="#F5BA42" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.6" />

  <!-- Cloak / Robes -->
  <path d="M22 96 C22 80 34 76 50 76 C66 76 78 80 78 96 Z" fill="#1E0A3C" stroke="#A855F7" stroke-width="1.5" />
  <path d="M42 78 L50 88 L58 78 Z" fill="#F5BA42" opacity="0.9" />

  <!-- Flowing Violet Hair -->
  <path d="M30 46 C24 55 24 72 32 80 C36 72 36 60 38 52 Z" fill="url(#hairGrad)" />
  <path d="M70 46 C76 55 76 72 68 80 C64 72 64 60 62 52 Z" fill="url(#hairGrad)" />

  <!-- Face -->
  <ellipse cx="50" cy="54" rx="14" ry="16" fill="#FDE8E8" />

  <!-- Enchanted Eyes (Glowing Amethyst) -->
  <ellipse cx="44" cy="53" rx="2.5" ry="3.5" fill="#1E0A3C" />
  <circle cx="44" cy="53" r="2" fill="#A855F7" />
  <circle cx="43" cy="52" r="0.8" fill="#FFFFFF" />

  <ellipse cx="56" cy="53" rx="2.5" ry="3.5" fill="#1E0A3C" />
  <circle cx="56" cy="53" r="2" fill="#A855F7" />
  <circle cx="55" cy="52" r="0.8" fill="#FFFFFF" />

  <!-- Soft Cheeks -->
  <circle cx="40" cy="58" r="2" fill="#F472B6" opacity="0.5" />
  <circle cx="60" cy="58" r="2" fill="#F472B6" opacity="0.5" />

  <!-- Lips -->
  <path d="M47 62 Q50 64 53 62" stroke="#9333EA" stroke-width="1.2" stroke-linecap="round" fill="none" />

  <!-- Front Hair Bangs -->
  <path d="M36 44 C42 48 46 48 50 44 C54 48 58 48 64 44 C60 40 40 40 36 44 Z" fill="url(#hairGrad)" />

  <!-- Witch Hat Brim -->
  <ellipse cx="50" cy="42" rx="34" ry="8" fill="#1E0A3C" stroke="#A855F7" stroke-width="1.5" />
  <ellipse cx="50" cy="42" rx="32" ry="6.5" fill="url(#hatGrad)" />

  <!-- Hat Cone -->
  <path d="M26 40 Q40 36 46 12 Q52 8 58 12 Q54 36 74 40 Z" fill="url(#hatGrad)" stroke="#A855F7" stroke-width="1.2" />

  <!-- Hat Ribbon (Golden Amber) -->
  <path d="M34 38 Q50 35 66 38 L65 41 Q50 38 35 41 Z" fill="#F5BA42" />

  <!-- Golden Moon Buckle -->
  <circle cx="50" cy="38" r="3.5" fill="#F5BA42" />
  <circle cx="51.2" cy="37.5" r="2.8" fill="#3B0764" />

  <!-- Magical Sparkles -->
  <polygon points="58,10 59.5,13 63,14 59.5,15 58,18 56.5,15 53,14 56.5,13" fill="#FDE047" filter="url(#glow)" />
  <circle cx="28" cy="26" r="1.5" fill="#F5BA42" opacity="0.8" filter="url(#glow)" />
  <circle cx="74" cy="28" r="1.5" fill="#A855F7" opacity="0.9" filter="url(#glow)" />
</svg>

